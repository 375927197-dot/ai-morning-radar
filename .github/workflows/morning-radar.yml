name: AI早盘雷达

on:
  workflow_dispatch:
  schedule:
    - cron: "32 8 * * 1-5"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: morning-radar
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
      QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
      EMAIL_TO: ${{ vars.EMAIL_TO }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -e .
      - name: 生成并推送晨报
        run: python -m ai_morning_radar run --scheduled
      - name: 保存本次报告附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-morning-radar-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: 提交历史报告
        run: |
          if [ -z "$(git status --porcelain -- reports/)" ]; then
            echo "没有新报告需要提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "report: update AI morning radar"
          git push
      - name: 失败时发送邮件
        if: failure()
        run: python -m ai_morning_radar notify-failure "GitHub Actions 运行失败：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
